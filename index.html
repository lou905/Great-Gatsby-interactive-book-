<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Green Light: A Great Gatsby Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Limelight&family=Poiret+One&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07080d; --panel:#10121b; --panel2:#171a26; --gold:#d8b45a; --gold2:#a8842e; --cream:#f2e8cf; --muted:#b9ad90;
  --green:#3be08f; --jade:#1d6b4c; --red:#d0614f; --blue:#6aa6d8;
  --disp:'Limelight', Georgia, serif; --deco:'Poiret One', 'Trebuchet MS', sans-serif; --body:'Lora', Georgia, serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--body);background:var(--bg);color:var(--cream);font-size:18.5px;line-height:1.55;min-height:100vh;
  background-image:
   repeating-linear-gradient(90deg, rgba(216,180,90,.035) 0 1px, transparent 1px 64px),
   radial-gradient(ellipse at 50% -10%, #1b2140 0%, var(--bg) 60%);}
.wrap{max-width:1240px;margin:0 auto;padding:16px 16px 70px}
.card > *:not(.scene):not(.mapsvg){max-width:860px;margin-left:auto;margin-right:auto}
.card > .scene.inline{max-width:none}
.ctrls{position:fixed;right:14px;bottom:14px;z-index:30;display:flex;gap:8px}
.ctrls button{background:rgba(0,0,0,.78);color:var(--gold);border:1px solid var(--gold2);padding:8px 14px;font-family:var(--deco);font-weight:700;font-size:13px;letter-spacing:.08em;cursor:pointer}
.ctrls button:hover{background:rgba(216,180,90,.18)}
.ctrls button.off{color:var(--muted);border-color:#444}
.nowp{position:fixed;left:14px;bottom:14px;z-index:30;font-family:var(--deco);font-weight:700;font-size:13px;letter-spacing:.08em;color:var(--gold);background:rgba(0,0,0,.6);padding:7px 12px;border:1px solid rgba(216,180,90,.3);opacity:0;transition:opacity .6s;pointer-events:none}
.nowp.on{opacity:1}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px;margin-right:8px;vertical-align:-1px}
.eq i{width:3px;background:var(--gold);animation:eq .8s infinite ease-in-out alternate}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{from{height:3px}to{height:12px}}

/* HUD */
.hud{display:none;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.hud.on{display:flex}
.chaps{display:flex;gap:6px;flex-wrap:wrap}
.chaps span{width:34px;height:34px;display:grid;place-items:center;font-family:var(--deco);font-weight:700;font-size:14px;color:var(--muted);
  border:1px solid rgba(216,180,90,.3);transform:rotate(45deg);transition:all .3s}
.chaps span i{transform:rotate(-45deg);font-style:normal}
.chaps span.done{background:rgba(216,180,90,.18);color:var(--gold);border-color:var(--gold)}
.chaps span.here{background:var(--gold);color:#111;border-color:#fff;box-shadow:0 0 14px rgba(216,180,90,.6)}
.stats{display:flex;gap:10px;align-items:center}
.pill{font-family:var(--deco);font-weight:700;font-size:15px;letter-spacing:.06em;border:1px solid var(--gold2);padding:6px 12px;color:var(--gold);background:rgba(0,0,0,.35)}
.pill b{color:var(--cream);font-size:17px;display:inline-block;transition:transform .2s}
.pill b.bump{transform:scale(1.5)}
button.pill{cursor:pointer}
button.pill:hover{background:rgba(216,180,90,.15)}

/* Card */
.card{position:relative;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--gold2);padding:26px 28px 24px;
  box-shadow:0 0 0 6px var(--bg), 0 0 0 7px rgba(216,180,90,.35), 0 25px 60px rgba(0,0,0,.6);animation:rise .5s ease-out;overflow:hidden}
.card:before,.card:after{content:"";position:absolute;width:46px;height:46px;border:2px solid var(--gold);pointer-events:none;z-index:3}
.card:before{top:8px;left:8px;border-right:none;border-bottom:none}
.card:after{bottom:8px;right:8px;border-left:none;border-top:none}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.scene{display:block;width:calc(100% + 56px);height:auto;margin:-26px -28px 20px;border-bottom:2px solid var(--gold2)}
.card h2 + .scene{margin-top:8px}
.scene.inline{width:100%;margin:6px 0 14px;border:1px solid var(--gold2)}
.eyebrow{font-family:var(--deco);font-weight:700;font-size:15px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
h1,h2{font-family:var(--disp);font-weight:400;margin:.15em 0 .4em;line-height:1.15;color:var(--cream);letter-spacing:.03em}
h2{font-size:clamp(26px,5vw,38px)}
h3{font-family:var(--deco);font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:0 0 .4em;font-size:16px}
p{margin:0 0 .85em}
em{color:#fff3d4}
.quote{position:relative;margin:16px 0;padding:16px 20px 14px 50px;border-left:2px solid var(--gold);background:rgba(216,180,90,.07)}
.quote:before{content:"“";position:absolute;left:12px;top:-6px;font-family:var(--disp);font-size:56px;color:var(--gold)}
.quote .qt{font-style:italic;font-size:19.5px;color:#fbf3dc}
.quote cite{display:block;margin-top:6px;font-style:normal;font-family:var(--deco);font-weight:700;letter-spacing:.1em;font-size:13.5px;color:var(--gold)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:16px}
.btn{font-family:var(--deco);font-weight:700;font-size:17px;letter-spacing:.12em;text-transform:uppercase;padding:12px 26px;cursor:pointer;
  color:#111;background:linear-gradient(180deg,#f0d58a,var(--gold) 50%,var(--gold2));border:none;box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--gold);transition:transform .1s, filter .15s}
.btn:hover{filter:brightness(1.1);transform:translateY(-2px)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn.ghost{background:transparent;color:var(--gold)}
.task{font-family:var(--deco);font-weight:700;font-size:18px;color:var(--gold);letter-spacing:.04em;margin:4px 0 8px}
.small{font-size:15px;color:var(--muted)}

/* choices */
.choices{display:grid;gap:10px;margin-top:10px}
.choice{font:inherit;font-size:17.5px;text-align:left;padding:12px 16px;cursor:pointer;color:var(--cream);background:rgba(255,255,255,.03);
  border:1px solid rgba(216,180,90,.35);display:flex;gap:12px;align-items:center;transition:all .15s}
.choice:hover:not(:disabled){border-color:var(--gold);background:rgba(216,180,90,.1);transform:translateX(4px)}
.choice:disabled{cursor:default;opacity:.5}
.choice .k{flex:none;width:28px;height:28px;display:grid;place-items:center;font-family:var(--deco);font-weight:700;border:1px solid var(--gold);color:var(--gold);transform:rotate(45deg)}
.choice .k i{transform:rotate(-45deg);font-style:normal}
.choice.good{border-color:var(--green);background:rgba(59,224,143,.12);opacity:1}
.choice.bad{border-color:var(--red);background:rgba(208,97,79,.14);opacity:1}
.fb{margin-top:12px;padding:12px 16px;border:1px solid rgba(216,180,90,.3);background:rgba(0,0,0,.25);animation:rise .4s}
.fb .v{font-family:var(--deco);font-weight:700;letter-spacing:.06em;font-size:18px;margin-bottom:4px}
.good-t{color:var(--green)} .bad-t{color:var(--red)}

/* hotspots */
.spot{cursor:pointer}
.spot .ring{transform-box:fill-box;transform-origin:center;animation:ring 1.6s infinite}
@keyframes ring{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.8);opacity:0}}
.spot.found .ring{animation:none;opacity:0}
.spot.found .core{fill:var(--green)}
.info{min-height:90px;padding:14px 16px;border:1px dashed rgba(216,180,90,.4);background:rgba(0,0,0,.25)}
.info h3{margin-bottom:4px}
.counter{font-family:var(--deco);font-weight:700;color:var(--gold);letter-spacing:.08em}

/* truth or tale */
.claim{padding:20px 22px;border:1px solid var(--gold);background:radial-gradient(ellipse at 50% 0%,rgba(216,180,90,.14),transparent 70%);text-align:center;animation:rise .35s}
.claim .n{font-family:var(--deco);font-weight:700;color:var(--gold);letter-spacing:.15em}
.claim .c{font-size:21px;font-style:italic;margin:8px 0 4px}
.tt{display:flex;gap:12px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.tt .btn{min-width:150px}

/* clock game */
.gauge{position:relative;height:26px;border:1px solid var(--gold2);background:linear-gradient(90deg,rgba(255,255,255,.04) 0 22%,rgba(59,224,143,.35) 22% 61%,rgba(208,97,79,.35) 61% 100%);margin:10px 0}
.gauge i{position:absolute;top:-6px;bottom:-6px;width:4px;background:var(--cream);left:0;box-shadow:0 0 8px #fff}
.gauge span{position:absolute;top:3px;font-family:var(--deco);font-weight:700;font-size:13px;letter-spacing:.08em}

/* timeline */
.pool{display:grid;gap:8px;margin:10px 0}
.ev{font:inherit;font-size:16.5px;text-align:left;padding:10px 14px;cursor:pointer;color:var(--cream);background:rgba(255,255,255,.04);border:1px solid rgba(216,180,90,.35)}
.ev:hover{border-color:var(--gold)}
.ev.shake{animation:shake .4s;border-color:var(--red)}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.tl{list-style:none;margin:10px 0;padding:0 0 0 22px;border-left:2px solid var(--gold)}
.tl li{position:relative;margin:0 0 10px;padding-left:6px;animation:rise .35s}
.tl li:before{content:"";position:absolute;left:-29px;top:7px;width:10px;height:10px;background:var(--gold);transform:rotate(45deg)}
.tl li b{font-family:var(--deco);color:var(--gold);margin-right:6px}

/* who said */
.speakers{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.speakers button{font-family:var(--deco);font-weight:700;font-size:16px;letter-spacing:.08em;padding:9px 16px;cursor:pointer;background:transparent;color:var(--cream);border:1px solid var(--gold2)}
.speakers button:hover:not(:disabled){background:rgba(216,180,90,.15);border-color:var(--gold)}
.speakers button.good{background:rgba(59,224,143,.2);border-color:var(--green)}
.speakers button.bad{background:rgba(208,97,79,.2);border-color:var(--red)}
.streak{font-family:var(--deco);font-weight:700;color:var(--gold);text-align:center;margin-top:8px;letter-spacing:.08em}

/* clue cards / people cards */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:12px 0}
.clue{position:relative;min-height:215px;cursor:pointer;perspective:800px;background:none;border:none;padding:0;font:inherit;color:inherit;text-align:left}
.clue .in{position:absolute;inset:0;transition:transform .6s;transform-style:preserve-3d}
.clue.open .in{transform:rotateY(180deg)}
.clue .f,.clue .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--gold2);padding:14px;display:flex;flex-direction:column;justify-content:center}
.clue .f{background:repeating-linear-gradient(45deg,#151826 0 10px,#11131e 10px 20px);align-items:center;text-align:center}
.clue .f b{font-family:var(--disp);font-size:28px;color:var(--gold)}
.clue .f small{font-family:var(--deco);font-weight:700;letter-spacing:.12em;color:var(--muted)}
.clue .b{display:block;overflow:auto;background:#1b1e2c;transform:rotateY(180deg);font-size:15.5px;line-height:1.45}
.person{font:inherit;cursor:pointer;padding:14px 12px;text-align:center;background:rgba(255,255,255,.03);border:1px solid rgba(216,180,90,.35);color:var(--cream);transition:all .15s}
.person .ic{font-size:30px;display:block}
.person b{display:block;font-family:var(--deco);font-weight:700;font-size:16px;letter-spacing:.04em}
.person small{display:block;font-size:13.5px;color:var(--muted);margin-top:4px}
.person.sel{border-color:var(--gold);background:rgba(216,180,90,.18);box-shadow:inset 0 0 0 1px var(--gold)}
.person.ok{border-color:var(--green);background:rgba(59,224,143,.13)}
.person.no{border-color:var(--red);background:rgba(208,97,79,.13)}
.person:disabled{cursor:default}

/* symbol + history */
.symbol{display:flex;gap:18px;align-items:center;padding:18px;border:1px solid var(--gold);background:radial-gradient(ellipse at 0% 50%,rgba(59,224,143,.12),transparent 60%);margin:14px 0;animation:rise .5s}
.symbol .big{font-size:52px;flex:none;width:80px;height:80px;display:grid;place-items:center;border:1px solid var(--gold);transform:rotate(45deg);background:rgba(0,0,0,.4)}
.symbol .big span{transform:rotate(-45deg)}
.history{padding:16px 18px;border-top:2px solid var(--gold2);border-bottom:2px solid var(--gold2);background:rgba(216,180,90,.06);margin:14px 0}
.history h3{color:var(--blue)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:40;display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.modal .card{max-width:760px;width:100%;max-height:90vh;overflow:auto}
.cab{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.tile{padding:12px;border:1px solid rgba(216,180,90,.35);background:rgba(255,255,255,.03)}
.tile .e{font-size:30px}
.tile b{display:block;font-family:var(--deco);font-weight:700;color:var(--gold);letter-spacing:.06em}
.tile small{display:block;font-size:14px;color:var(--muted)}
.tile.locked{opacity:.4}

/* title */
.title{text-align:center}
.title p{max-width:600px;margin:10px auto}
.rank{font-family:var(--disp);font-size:34px;color:var(--gold);text-align:center;margin:6px 0}
.scorebox{display:flex;justify-content:center;gap:30px;font-family:var(--deco);font-weight:700;letter-spacing:.1em;text-align:center;margin:8px 0}
.scorebox b{display:block;font-family:var(--disp);font-size:34px;color:var(--cream);letter-spacing:0}
.finalq .ln{opacity:0;animation:fade 1.2s forwards}
@keyframes fade{to{opacity:1}}
.mute{position:fixed;right:14px;bottom:14px;z-index:30;background:rgba(0,0,0,.7);color:var(--gold);border:1px solid var(--gold2);padding:8px 14px;font-family:var(--deco);font-weight:700;font-size:13px;letter-spacing:.08em;cursor:pointer}

/* svg animation */
.twk{animation:tw 3s infinite ease-in-out}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
.gl-pulse{transform-box:fill-box;transform-origin:center;animation:glp 2.4s infinite ease-in-out}
@keyframes glp{50%{opacity:.55}}
.hint .gl-pulse{animation:glh 1s infinite ease-in-out}
@keyframes glh{50%{transform:scale(2.6)}}
.shimmer{animation:shim 2.6s infinite ease-in-out}
@keyframes shim{50%{opacity:.3}}
.sway{transform-box:fill-box;transform-origin:bottom center;animation:sway 1.1s infinite ease-in-out alternate}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.flick{animation:flick 1.8s infinite}
@keyframes flick{50%{opacity:.6}}
.rain line{animation:rain .7s linear infinite}
@keyframes rain{from{transform:translate(0,-60px)}to{transform:translate(-14px,60px)}}
.heat{animation:heat 3s infinite ease-in-out}
@keyframes heat{50%{transform:translateY(-3px);opacity:.5}}
.speed{animation:speed .5s linear infinite}
@keyframes speed{from{transform:translateX(30px);opacity:.9}to{transform:translateX(-40px);opacity:0}}
.row-boat{animation:drift 6s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(-26px)}}
.oar{transform-box:fill-box;transform-origin:top center;animation:oar 1.5s ease-in-out infinite}
@keyframes oar{50%{transform:rotate(28deg)}}
.bob{animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion: reduce){.twk,.gl-pulse,.shimmer,.sway,.flick,.rain line,.heat,.speed,.row-boat,.oar,.bob,.spot .ring{animation:none!important}}
@media (max-width:600px){
  body{font-size:17.5px}.card{padding:20px 18px}.scene{width:calc(100% + 36px);margin:-20px -18px 16px}
  .chaps span{width:26px;height:26px;font-size:11px}.symbol .big{width:62px;height:62px;font-size:38px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud" id="hud">
    <div class="chaps" id="chaps"></div>
    <div class="stats">
      <div class="pill">✦ INSIGHT <b id="ins">0</b></div>
      <button class="pill" id="symBtn">◆ SYMBOLS <b id="symN">0</b>/9</button>
    </div>
  </div>
  <main id="app"></main>
</div>
<div class="modal" id="modal"><div class="card"><h2>Symbol Collection</h2><p class="small">Fitzgerald fills the novel with objects that mean more than they seem. Here are the ones you’ve unlocked.</p><div class="cab" id="cab"></div><div class="row"><span></span><button class="btn" id="closeM">Close</button></div></div></div>
<div class="nowp" id="nowp"><span class="eq"><i></i><i></i><i></i></span><span id="nowt"></span></div>
<div class="ctrls"><button id="fsBtn" title="Full screen">⤢ FULL SCREEN</button><button id="musBtn">♫ MUSIC ON</button><button id="mute">SFX ON</button></div>

<script>
/* ================= ART HELPERS ================= */
let SID=0, rs=1;
const P=n=>Math.round(n*10)/10;
const seed=n=>{rs=n};
const rnd=()=>{rs=rs*16807%2147483647;return (rs-1)/2147483646;};
function wrap(sky,inner,label,h=340,cls='scene',idAttr=''){
  SID++; const id=SID;
  return `<svg ${idAttr} class="${cls}" viewBox="0 0 800 ${h}" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${label}">
  <defs><linearGradient id="sk${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sky[0]}"/><stop offset="1" stop-color="${sky[1]}"/></linearGradient>
  <radialGradient id="gl${id}"><stop offset="0" stop-color="#fff3c4" stop-opacity=".9"/><stop offset=".4" stop-color="#ffd76a" stop-opacity=".35"/><stop offset="1" stop-color="#ffd76a" stop-opacity="0"/></radialGradient>
  <radialGradient id="gg${id}"><stop offset="0" stop-color="#b8ffd9" stop-opacity="1"/><stop offset=".3" stop-color="#3be08f" stop-opacity=".6"/><stop offset="1" stop-color="#3be08f" stop-opacity="0"/></radialGradient></defs>
  <rect width="800" height="${h}" fill="url(#sk${id})"/>${inner.replace(/GLOW/g,`url(#gl${id})`).replace(/GREENG/g,`url(#gg${id})`)}</svg>`;
}
function stars(n,maxY,sd=3){seed(sd);let s='';for(let k=0;k<n;k++)s+=`<circle class="twk" cx="${P(rnd()*800)}" cy="${P(rnd()*maxY)}" r="${P(.5+rnd()*1.3)}" fill="#fff" style="animation-delay:${P(rnd()*3)}s"/>`;return s;}
function glow(x,y,r){return `<circle cx="${x}" cy="${y}" r="${r}" fill="GLOW"/>`;}
function man(x,y,s=1,c='#0b0c12',o={}){
  let g=`<g fill="${c}" stroke="${c}" stroke-linecap="round">`;
  g+=`<circle cx="${P(x)}" cy="${P(y-60*s)}" r="${P(6.5*s)}" stroke="none"/>`;
  if(o.hat) g+=`<rect x="${P(x-9*s)}" y="${P(y-67*s)}" width="${P(18*s)}" height="${P(2.5*s)}" stroke="none"/><rect x="${P(x-6*s)}" y="${P(y-72*s)}" width="${P(12*s)}" height="${P(6*s)}" stroke="none"/>`;
  g+=`<path d="M${P(x-10*s)} ${P(y-51*s)} Q${P(x)} ${P(y-55*s)} ${P(x+10*s)} ${P(y-51*s)} L${P(x+8.5*s)} ${P(y-24*s)} L${P(x-8.5*s)} ${P(y-24*s)}Z" stroke="none"/>`;
  g+=`<rect x="${P(x-7.5*s)}" y="${P(y-26*s)}" width="${P(6*s)}" height="${P(26*s)}" stroke="none"/><rect x="${P(x+1.5*s)}" y="${P(y-26*s)}" width="${P(6*s)}" height="${P(26*s)}" stroke="none"/>`;
  const w=P(3.6*s);
  if(o.armsOut) g+=`<path d="M${P(x-9*s)} ${P(y-48*s)} L${P(x-32*s)} ${P(y-52*s)} M${P(x+9*s)} ${P(y-48*s)} L${P(x+32*s)} ${P(y-52*s)}" stroke-width="${w}" fill="none"/>`;
  else if(o.armUp) g+=`<path d="M${P(x-9.5*s)} ${P(y-49*s)} L${P(x-11*s)} ${P(y-28*s)} M${P(x+9*s)} ${P(y-48*s)} L${P(x+20*s)} ${P(y-68*s)}" stroke-width="${w}" fill="none"/>`;
  else g+=`<path d="M${P(x-9.5*s)} ${P(y-49*s)} L${P(x-11*s)} ${P(y-28*s)} M${P(x+9.5*s)} ${P(y-49*s)} L${P(x+11*s)} ${P(y-28*s)}" stroke-width="${w}" fill="none"/>`;
  if(o.glass) g+=`<path d="M${P(x+11*s)} ${P(y-30*s)} l${P(-3*s)} ${P(-8*s)} h${P(6*s)} z" fill="#ffe08a" stroke="none"/>`;
  return g+'</g>';
}
function woman(x,y,s=1,dress='#c9a24a',o={}){
  const skin=o.skin||dress, hair=o.hair||'#0b0b10';
  let g=`<g stroke-linecap="round">`;

function mansion(x,base,w,h,c,sd,o={}){
  seed(sd); let s='';

  s+=`<rect x="${x}" y="${base-h}" width="${w}" height="${h}" fill="${c}"/>`;
  s+=`<path d="M${x-6} ${base-h} L${x+14} ${base-h-26} L${x+w-14} ${base-h-26} L${x+w+6} ${base-h}Z" fill="${o.roof||'#1a1c28'}"/>`;
  if(o.tower!==false){
    s+=`<rect x="${x+w-tw}" y="${base-h-56}" width="${tw}" height="${h+56}" fill="${c}"/><path d="M${x+w-tw-4} ${base-h-56} L${x+w-tw/2} ${base-h-100} L${x+w+4} ${base-h-56}Z" fill="${o.roof||'#1a1c28'}"/>`;
    s+=`<rect x="${x+w-tw/2-4}" y="${base-h-48}" width="8" height="14" fill="${o.lit?'#ffd76a':'#2a2c38'}"/>`;
  }
  const cols=Math.floor((w-tw-10)/22), rows=Math.max(2,Math.floor(h/30));
  for(let r=0;r<rows;r++)for(let k=0;k<cols;k++){
    const on=o.lit && rnd()<(o.litP||.8);
    s+=`<rect x="${P(x+10+k*22)}" y="${P(base-h+10+r*28)}" width="10" height="16" fill="${on?'#ffd76a':'#262838'}" ${on&&rnd()<.25?'class="flick"':''}/>`;
  }
  if(o.lit) s+=glow(x+w/2,base-h/2,w*.75);

}
function skyline(base,color,sd,x0=0,x1=800,maxH=140,win=false){

    if(rnd()<.35){s+=`<rect x="${P(x+w*.2)}" y="${P(base-h-12)}" width="${P(w*.6)}" height="12" fill="${color}"/><rect x="${P(x+w*.4)}" y="${P(base-h-30)}" width="${P(w*.2)}" height="18" fill="${color}"/>`;}
    if(rnd()<.15){s+=`<path d="M${P(x+w/2-2)} ${P(base-h-30)} L${P(x+w/2)} ${P(base-h-58)} L${P(x+w/2+2)} ${P(base-h-30)}Z" fill="${color}"/>`;}
    if(win){for(let k=0;k<4;k++)if(rnd()<.6)s+=`<rect x="${P(x+3+rnd()*(w-6))}" y="${P(base-h+8+rnd()*(h-14))}" width="2.5" height="3" fill="#ffd76a" opacity=".8"/>`;}
    x+=w+1;}
  return s;
}

function rainLines(n,sd,h=340){seed(sd);let s='<g class="rain" stroke="#c8d4e8" stroke-opacity=".35" stroke-width="1.2">';for(let k=0;k<n;k++){const x=rnd()*840,y=rnd()*h;s+=`<line x1="${P(x)}" y1="${P(y)}" x2="${P(x-6)}" y2="${P(y+18)}" style="animation-delay:${P(rnd()*.7)}s"/>`;}return s+'</g>';}
function sunburst(x,y,n,len,c,op){let s='';for(let k=0;k<n;k++){const a=Math.PI+k*Math.PI/(n-1),w=.035;s+=`<path d="M${x} ${y} L${P(x+Math.cos(a-w)*len)} ${P(y+Math.sin(a-w)*len)} L${P(x+Math.cos(a+w)*len)} ${P(y+Math.sin(a+w)*len)}Z" fill="${c}" opacity="${op}"/>`;}return s;}

/* multiple-choice helper */
function mcq(el,q,opts,ans,explain,onDone,pts=1){
  maxIns+=pts;
  const o=shuffle(opts.map((t,k)=>({t,ok:k===ans})));
  el.innerHTML=`<div class="task">${q}</div><div class="choices">${o.map((x,k)=>`<button class="choice" data-ok="${x.ok?1:0}"><span class="k"><i>${'ABCD'[k]}</i></span><span>${x.t}</span></button>`).join('')}</div><div class="fbx"></div>`;
  el.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{
    const ok=b.dataset.ok==='1';
    el.querySelectorAll('.choice').forEach(x=>{x.disabled=true;if(x.dataset.ok==='1')x.classList.add('good');});
    if(!ok)b.classList.add('bad');
    if(ok){addIns(pts);ding();}else buzz();
    el.querySelector('.fbx').innerHTML=`<div class="fb"><div class="v ${ok?'good-t':'bad-t'}">${ok?'✦ Sharp eye. +'+pts+' insight':'Not quite.'}</div>${explain}<div class="row"><span></span><button class="btn nx">Continue</button></div></div>`;
    el.querySelector('.nx').onclick=onDone;
  });
}
function quoteBox(t,c){return `<div class="quote"><div class="qt">${t}</div><cite>${c}</cite></div>`;}

function intro(){
  Music.play(moodFor());

function actCard(inner){

function wrapUp(extra=''){

  app.innerHTML=`<article class="card"><div class="eyebrow">Chapter ${c.roman} · Complete</div><h2>${c.title}</h2>
    ${extra}

/* hotspot helper */
function hotspots(svgKey,spots,onAll,opts={}){
  let svg=SC[svgKey](true);
  const marks=spots.map((s,k)=>`<g class="spot" data-k="${k}" ${s.hidden?'style="display:none"':''}><circle class="ring" cx="${s.x}" cy="${s.y}" r="18" fill="none" stroke="#ffe08a" stroke-width="3"/><circle class="core" cx="${s.x}" cy="${s.y}" r="9" fill="#ffd76a" stroke="#111" stroke-width="2"/><circle cx="${s.x}" cy="${s.y}" r="30" fill="transparent"/></g>`).join('');
  svg=svg.replace(/<\/svg>$/,marks+'</svg>');
  const need=spots.filter(s=>!s.hidden).length;
  actCard(`<p class="task">${opts.task}</p>${svg}<div class="row" style="margin-top:0"><span class="counter" id="cnt">Found 0 / ${need}</span><span class="small">Tap the glowing markers</span></div><div class="info" id="info"><p class="small" style="margin:0">${opts.empty}</p></div><div id="after"></div>`);
  const found=new Set();
  $$('.spot').forEach(g=>g.addEventListener('click',()=>{
    const k=+g.dataset.k, s=spots[k];
    $('#info').innerHTML=`<h3>${s.label}</h3>${s.text}`;
    if(!found.has(k)){found.add(k);g.classList.add('found');tone([660,880],'triangle',.1);
      const vis=spots.filter((x,j)=>!x.hidden||found.has(j)).length;
      $('#cnt').textContent=`Found ${found.size} / ${Math.max(need,vis)}`;
      if(s.final){ setTimeout(()=>onAll($('#after')),400); }
      else if(found.size===need){
        const h=spots.findIndex(x=>x.hidden);
        if(h>=0){ const hg=document.querySelector(`.spot[data-k="${h}"]`); hg.style.display=''; $('#cnt').textContent=`Found ${found.size} / ${need+1}`;
          $('#info').innerHTML+=`<p class="good-t" style="margin:8px 0 0"><b>✦ ${opts.unlock}</b></p>`; }
        else setTimeout(()=>onAll($('#after')),400);
      }
    }
  }));
}

/* V — catch the clock */
()=>{
  maxIns+=1;
  actCard(`<p class="task">Gatsby leans back nervously, and your clock starts to tip! Press <b>CATCH</b> (or the spacebar) when the needle is in the green zone.</p>${SC.parlor(true)}
   <div class="gauge"><i id="needle"></i><span style="left:4%">STEADY</span><span style="left:30%;color:#3be08f">CATCH IT!</span><span style="left:68%;color:#d0614f">TOO LATE</span></div>
   <div class="row" style="margin-top:6px"><span class="counter" id="tries">Attempt 1 of 2</span><button class="btn" id="catch" disabled>Catch!</button></div><div id="cmsg"></div><div id="after"></div>`);
  let attempt=1, running=false, t0=0, raf=0, caught=false;
  const clock=$('#clock'), needle=$('#needle');
  const setA=a=>{clock.setAttribute('transform',`rotate(${P(a)} 298 150)`);needle.style.left=Math.min(98,a/90*100)+'%';};
  const finish=(ok,why)=>{
    running=false; cancelAnimationFrame(raf); $('#catch').disabled=true;
    if(ok){caught=true;addIns(1);ding();$('#cmsg').innerHTML=`<div class="fb"><div class="v good-t">✦ Caught it! +1 insight</div><p style="margin:0">Gatsby spins around and catches it with trembling fingers. “I’m sorry about the clock,” he says. The past almost came crashing down, and it was only a clock.</p></div>`;next();}
    else{buzz();
      if(why==='late'){clock.style.transition='transform .5s ease-in';clock.setAttribute('transform','translate(30 160) rotate(120 298 150)');}
      $('#cmsg').innerHTML=`<div class="fb"><div class="v bad-t">${why==='early'?'Too early!':'Crash!'}</div><p style="margin:0">${why==='early'?'You grabbed it before it started to fall. Wait for the green zone.':'In the book, Gatsby catches it just in time. Close call.'}</p>${attempt<2?'<div class="row"><span></span><button class="btn" id="again">Try again</button></div>':''}</div>`;
      if(attempt<2){$('#again').onclick=()=>{attempt++;$('#tries').textContent='Attempt 2 of 2';clock.style.transition='';$('#cmsg').innerHTML='';start();};} else next();
    }
  };
  const loop=t=>{ const k=(t-t0)/2000, a=90*k*k; setA(a); if(a>=56){finish(false,'late');return;} raf=requestAnimationFrame(loop); };
  const start=()=>{ setA(0); running=true; $('#catch').disabled=false; setTimeout(()=>{ if(running){t0=performance.now(); raf=requestAnimationFrame(loop);} },600); t0=performance.now()+600; };
  const press=()=>{ if(!running) return; const k=Math.max(0,(performance.now()-t0)/2000), a=90*k*k; if(a<20) finish(false,'early'); else finish(true); };
  $('#catch').onclick=press;
  const key=e=>{ if(e.code==='Space' && running){e.preventDefault();press();} };
  document.addEventListener('keydown',key);
  function next(){
    document.removeEventListener('keydown',key);
    mcq($('#after'),"Later, Gatsby gives Daisy a tour of his mansion and throws pile after pile of beautiful shirts onto the table. Daisy bursts into tears. Why?",["She’s overwhelmed by his wealth, and by the life she gave up","She hates the colors","The shirts belong to Tom","She’s allergic to silk"],0,
      quoteBox("They’re such beautiful shirts. It makes me sad because I’ve never seen such—such beautiful shirts before.","Daisy · Chapter 5")+`<p style="margin:0">The shirts stand for everything Gatsby built to win her. Later, looking at the green light with Daisy beside him, Gatsby realizes it’s just a light on a dock again: “his count of enchanted objects had diminished by one.”</p>`,()=>wrapUp());
  }
  setTimeout(start,700);
},

   {t:"A witness tells the police the car that hit Myrtle was <b>a big, new, yellow car</b>. It slowed down for a moment, then sped away."},
   {t:"Earlier that day, Tom had borrowed Gatsby’s yellow car and stopped at Wilson’s garage for gas. Wilson saw Tom driving it."},
   {t:"Late that night, Nick finds Gatsby waiting outside the Buchanans’ house. Nick asks, “Was Daisy driving?” Gatsby admits: “Yes, but of course I’ll say I was.”"}
  ];
  actCard(`${SC.deathcar()}<p class="task">Turn over every clue card. Then solve the case.</p><div class="grid" id="cg">${clues.map((c,k)=>`<button class="clue" data-k="${k}"><div class="in"><div class="f"><b>${k+1}</b><small>CLUE</small></div><div class="b">${c.t}</div></div></button>`).join('')}</div><div id="after"></div>`);
  const open=new Set();
  $$('#cg .clue').forEach(b=>b.onclick=()=>{
    if(open.has(b.dataset.k)) return;
    open.add(b.dataset.k); b.classList.add('open'); tone([392,330],'triangle',.08);
    if(open.size===clues.length) setTimeout(()=>{
      mcq($('#after'),"Who was driving the car that killed Myrtle Wilson?",["Daisy","Gatsby","Tom","Nick"],0,
        `<p style="margin:6px 0 0">Daisy was driving, but Gatsby decides to take the blame to protect her. He waits outside her house all night in case Tom hurts her, while inside, Tom and Daisy are calmly eating cold fried chicken together.</p>`,
        ()=>{ $('#after').innerHTML='<div id="m2"></div>';
          mcq($('#m2'),"George Wilson becomes obsessed with finding the owner of the yellow car. Who tells him it belongs to Gatsby?",["Tom","Daisy","Nick","Jordan"],0,
            `<p style="margin:6px 0 0">In Chapter 9, Tom admits it to Nick: he told Wilson whose car it was. Staring at the billboard, Wilson had said, “God sees everything.” His neighbor told him, “That’s an advertisement.”</p>`+quoteBox("Gatsby shouldered the mattress and started for the pool.","Nick · Chapter 8")+`<p style="margin:0">That afternoon, Gatsby finally goes for a swim, waiting for a phone call from Daisy that never comes. Wilson finds him there.</p>`,()=>wrapUp());
        });
    },500);
  });
},
/* IX — funeral */
()=>{
  const ppl=[
   {n:'Nick Carraway',i:'🎩',s:'Gatsby’s neighbor',came:true,x:'Nick arranged everything himself.'},
   {n:'Henry C. Gatz',i:'👴',s:'Gatsby’s father',came:true,x:'He traveled from Minnesota after seeing the news. He shows Nick the self-improvement schedule young James wrote as a boy.'},
   {n:'“Owl Eyes”',i:'👓',s:'Guest from the library',came:true,x:'The man from the library shows up in the rain, the only party guest who does.'},
   {n:'The servants and the mailman',i:'✉️',s:'From West Egg',came:true,x:'A few of Gatsby’s servants and the West Egg postman came.'},
   {n:'Daisy Buchanan',i:'🌼',s:'The woman he loved',came:false,x:'Daisy and Tom left town on a trip, leaving no address. She didn’t send a message or a flower.'},
   {n:'Tom Buchanan',i:'🏈',s:'Daisy’s husband',came:false,x:'Tom is gone too, and doesn’t feel a bit sorry.'},
   {n:'Meyer Wolfshiem',i:'🎲',s:'Gatsby’s “business” partner',came:false,x:'He sent a letter saying he couldn’t get mixed up in it.'},
   {n:'Klipspringer',i:'🎹',s:'Lived in Gatsby’s house for months',came:false,x:'He called, but only to ask Nick to mail him a pair of tennis shoes he’d left behind.'}
  ];
  maxIns+=2;
  actCard(`${SC.funeral()}<p class="task">Select everyone you think came to Gatsby’s funeral, then press Check.</p><div class="grid" id="pg">${shuffle(ppl.map((p,k)=>({...p,k}))).map(p=>`<button class="person" data-k="${p.k}"><span class="ic">${p.i}</span><b>${p.n}</b><small>${p.s}</small></button>`).join('')}</div><div class="row"><span class="small" id="selc">0 selected</span><button class="btn" id="chk">Check</button></div><div id="after"></div>`);
  $$('#pg .person').forEach(b=>b.onclick=()=>{b.classList.toggle('sel');$('#selc').textContent=$$('#pg .person.sel').length+' selected';});
  $('#chk').onclick=()=>{
    let right=0;
    $$('#pg .person').forEach(b=>{const p=ppl[+b.dataset.k], sel=b.classList.contains('sel'); b.disabled=true;
      if(sel===p.came) right++;
      b.classList.add(p.came?'ok':'no');
      b.querySelector('small').innerHTML=`<b style="font-size:13px;color:${p.came?'var(--green)':'var(--red)'}">${p.came?'CAME':'DIDN’T COME'}${sel!==p.came?' ✗':' ✓'}</b>${p.x}`;
    });
    $('#chk').disabled=true;
    const pts=right===8?2:(right>=6?1:0); if(pts){addIns(pts);ding();}else buzz();
    $('#after').innerHTML=`<div class="fb"><div class="v ${pts?'good-t':'bad-t'}">${right} of 8 correct${pts?' · +'+pts+' insight':''}</div><p style="margin:0">Hundreds of people came to Gatsby’s parties. Almost no one came to his funeral.</p>${quoteBox(CH[8].quote.t,CH[8].quote.c)}<div class="row"><span></span><button class="btn" id="fin">Continue</button></div></div>`;
    $('#fin').onclick=()=>wrapUp();
  };
}
];

/* ================= ENDING ================= */
function ending(){
  Music.play('blue');
  ci=9; hud();
  const pct=maxIns?insight/maxIns:0;
  const R= pct>=.85?['Old Sport','Gatsby himself would throw you a party. You caught nearly everything Fitzgerald hid in the story.']
        : pct>=.65?['Careful Narrator','Like Nick, you notice what other people miss. A strong reader of the novel.']
        : pct>=.4 ?['Party Guest','You had a great time, but a few secrets slipped past you. Try another round.']
        :          ['Lost in the Valley of Ashes','The fog got you this time. Reread a few chapters and take another run at it.'];
  const lines=["And as I sat there brooding on the old, unknown world, I thought of Gatsby’s wonder when he first picked out the green light at the end of Daisy’s dock.","It eluded us then, but that’s no matter—tomorrow we will run faster, stretch out our arms farther…","So we beat on, boats against the current, borne back ceaselessly into the past."];
  app.innerHTML=`<article class="card">${SC.boat()}
    <div class="eyebrow">The Final Page</div><h2>Boats Against the Current</h2>
    <div class="quote finalq">${lines.map((l,k)=>`<div class="qt ln" style="animation-delay:${.6+k*1.6}s;margin-bottom:6px">${l}</div>`).join('')}<cite class="ln" style="animation-delay:5.4s">Nick · Chapter 9</cite></div>
    <div class="scorebox"><div><b>${insight}/${maxIns}</b>INSIGHT</div><div><b>${got.filter(Boolean).length}/9</b>SYMBOLS</div></div>
    <div class="rank">${R[0]}</div><p style="text-align:center">${R[1]}</p>
    <div class="history"><h3 style="color:var(--gold)">Talk About It</h3><ol style="margin:0;padding-left:20px">
      <li>Is Gatsby “great”? Defend your answer with something he does in the novel.</li>
      <li>Nick says he’s “one of the few honest people” he has ever known. Do you trust him as a narrator?</li>
      <li>What does the green light mean at the start of the book, and what does it mean by the end?</li>
      <li>Who is most responsible for Gatsby’s death? Rank Tom, Daisy, Wilson and Gatsby himself.</li>
      <li>What would the American Dream look like for someone your age today?</li></ol></div>
    <div class="row"><button class="btn ghost" id="symOpen">View All Symbols</button><button class="btn" id="again">Play Again</button></div></article>`;
  scrollUp(); tone([392,494,587,784],'triangle');
  $('#symOpen').onclick=()=>$('#symBtn').click();
  $('#again').onclick=title;
}

title();
</script>
